[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/pdf",
    "crates/render",
    "crates/search",
    "crates/store",
    "crates/platform",
    "crates/ui",
    "crates/app",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/needyamin/pdf-reader"
authors = ["YAMiN HOSSAIN"]

[workspace.dependencies]
# --- domain ---
pdfreader-core = { path = "crates/core" }
pdfreader-pdf = { path = "crates/pdf" }
pdfreader-render = { path = "crates/render" }
pdfreader-search = { path = "crates/search" }
pdfreader-store = { path = "crates/store" }
pdfreader-platform = { path = "crates/platform" }
pdfreader-ui = { path = "crates/ui" }

# --- pdf engine ---
# `pdfium_latest` and `thread_safe` are pdfium-render defaults; keep them.
# `thread_safe` is what makes `Pdfium` Send + Sync (a process-global mutex around
# every FPDF call) - it prevents crashes, it does not add parallelism.
pdfium-render = "0.9.4"

# --- ui ---
egui = "0.36"
eframe = "0.36"
egui-wgpu = "0.36"
wgpu = "30"

# --- concurrency ---
crossbeam = "0.8"
crossbeam-channel = "0.5"
parking_lot = "0.12"
arc-swap = "1"

# --- data ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- misc ---
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rfd = "0.17"
image = "0.25"
quick_cache = "0.6"
zstd = "0.13"
clap = { version = "4", features = ["derive"] }
criterion = "0.5"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Chosen deliberately for a UI codebase:
too_many_arguments = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
# Incremental compilation is disabled deliberately.
#
# This workspace can live on a drive where rustc's incremental cache hits
# intermittent file-lock errors ("Access is denied (os error 5)") on the
# lock/object files. A cache left in that half-written state makes rustc
# crash with an internal compiler error (ICE). Turning incremental off
# trades a little rebuild speed for a build that always works.
incremental = false
